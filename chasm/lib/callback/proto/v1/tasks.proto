syntax = "proto3";

package temporal.server.chasm.lib.callbacks.proto.v1;

option go_package = "go.temporal.io/server/chasm/lib/callbacks/gen/callbackspb;callbackspb";

message InvocationTask {
  // The attempt number for this invocation.
  int32 attempt = 1;
}

message BackoffTask {
  // The attempt number for this invocation.
  int32 attempt = 1;
}

// Delivers the callback's pending progress while the source runs.
message ProgressTask {
  // The counter of the delivery in flight when the task was scheduled.
  int64 counter = 1;
  // The attempt of that delivery.
  int32 attempt = 2;
}

// Retries a progress delivery that failed with a retryable error.
message ProgressBackoffTask {
  int64 counter = 1;
  int32 attempt = 2;
}
