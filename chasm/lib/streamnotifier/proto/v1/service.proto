syntax = "proto3";

package temporal.server.chasm.lib.streamnotifier.proto.v1;

import "chasm/lib/streamnotifier/proto/v1/request_response.proto";
import "temporal/server/api/common/v1/api_category.proto";
import "temporal/server/api/routing/v1/extension.proto";

option go_package = "go.temporal.io/server/chasm/lib/streamnotifier/gen/streamnotifierpb;streamnotifierpb";

service StreamNotifierService {
  rpc AttachStreamCallback(AttachStreamCallbackRequest) returns (AttachStreamCallbackResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc DetachStreamCallback(DetachStreamCallbackRequest) returns (DetachStreamCallbackResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc NotifyStream(NotifyStreamRequest) returns (NotifyStreamResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }

  rpc DescribeStreamNotifier(DescribeStreamNotifierRequest) returns (DescribeStreamNotifierResponse) {
    option (temporal.server.api.routing.v1.routing).business_id = "business_id";
    option (temporal.server.api.common.v1.api_category).category = API_CATEGORY_STANDARD;
  }
}
