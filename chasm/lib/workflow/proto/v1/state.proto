syntax = "proto3";

package temporal.server.chasm.lib.workflow.proto.v1;

option go_package = "go.temporal.io/server/chasm/lib/workflow/gen/workflowpb;workflowpb";

import "google/protobuf/timestamp.proto";
import "temporal/api/stream/v1/message.proto";

// NexusOperationParentData contains workflow-specific data stored in a nexus operation's
// parent_data field when the operation is embedded in a workflow.
message NexusOperationParentData {
  // Event ID of the NEXUS_OPERATION_SCHEDULED event.
  int64 scheduled_event_id = 1;
  // Token for loading the NEXUS_OPERATION_SCHEDULED event.
  bytes scheduled_event_token = 2;
}

// NexusCancellationParentData contains workflow-specific data stored in a nexus cancellation's
// parent_data field when the operation is embedded in a workflow.
message NexusCancellationParentData {
  // Event ID of the NEXUS_OPERATION_CANCEL_REQUESTED event.
  int64 requested_event_id = 1;
}

// IncomingSignalData records the event associated with a signal's request ID, which allows
// DescribeWorkflow to resolve RequestIDRef signal backlinks.
message IncomingSignalData {
  int64 event_id = 1;
}

// Which keys of one kind of state wait for, or ride, a Workflow Task scheduled event. Such state
// writes no event, so nothing else schedules the task that carries it.
message TaskCarriedIndex {
  // Keys whose state waits for the next Workflow Task scheduled event.
  repeated string pending = 1;
  // When a Workflow Task last carried this state. Waiting state waits a minimum interval after it
  // before it schedules a task of its own, so a busy source can't fill the Workflow's History.
  google.protobuf.Timestamp last_carried_time = 2;
  // When the armed release task lets waiting state schedule a Workflow Task.
  google.protobuf.Timestamp release_time = 3;
}

// The stream wakes of a Workflow run, by the subscription ID of each reader.
message StreamWakeState {
  TaskCarriedIndex index = 1;
  // The latest wake of each reader that waits for a Workflow Task.
  map<string, temporal.api.stream.v1.StreamWake> wakes = 2;
  // Every reader that got a wake in this run, sorted. Bounded by
  // history.maximumStreamWakeSources.
  repeated string sources = 3;
}
